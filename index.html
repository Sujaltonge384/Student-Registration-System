<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header class="header">
            <h1>Student Registration System</h1>
            <p>Seamlessly register, manage, edit, and delete student records in one place.</p>
        </header>

        <div class="content-wrapper">
            <section class="form-section">
                <h2>Register Student</h2>
                <form id="registrationForm">
                    <input type="hidden" id="editIndex" value="-1">
                    
                    <div class="input-group">
                        <label for="studentName">Student Name</label>
                        <input type="text" id="studentName" placeholder="Enter full name" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="studentId">Student ID</label>
                        <input type="text" id="studentId" placeholder="e.g. 101" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="emailId">Email ID</label>
                        <input type="email" id="emailId" placeholder="example@domain.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="contactNo">Contact No.</label>
                        <input type="text" id="contactNo" placeholder="At least 10 digits" required>
                    </div>
                    
                    <button type="submit" id="submitBtn">Add Student</button>
                </form>
            </section>

            <section class="display-section">
                <h2>Registered Records</h2>
                <div id="tableContainer">
                    <table id="studentTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>ID</th>
                                <th>Email</th>
                                <th>Contact No.</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentList">
                            </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
